<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Live Channels</title>
<link rel="icon" href="/sportlink.png">

<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;background:#0a0a0f;font-family:'Segoe UI',sans-serif;overflow:hidden;}

#main-iframe{width:100%;height:100%;border:none;display:block;position:absolute;top:0;left:0;background:#0a0a0f;}

#picker{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;background:#0a0a0f;display:none;}

.picker-header{
  position:sticky;top:0;z-index:10;
  background:linear-gradient(180deg,#0a0a0f 80%,transparent);
  padding:20px 16px 10px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  flex-wrap:wrap;
}
.picker-title{color:#fff;font-size:20px;font-weight:700;letter-spacing:.5px;flex-shrink:0;}
.picker-title span{color:#1e88e5;}

.search-bar{padding:0 16px 12px;}
.search-bar input{
  width:100%;background:#1a1a2e;border:1px solid #2a2a40;
  border-radius:10px;padding:10px 14px;color:#fff;font-size:14px;outline:none;
}
.search-bar input::placeholder{color:#555;}
.search-bar input:focus{border-color:#1e88e5;}

.channel-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:10px;padding:0 16px 24px;
}
.channel-card{
  background:#141420;border:1px solid #1e1e30;border-radius:12px;
  padding:12px;cursor:pointer;
  transition:background .15s,border-color .15s,transform .1s;
  display:flex;align-items:center;gap:10px;text-decoration:none;
}
.channel-card:active{transform:scale(.97);}
.channel-card:hover{background:#1a1a2e;border-color:#1e88e5;}

.channel-logo{
  width:36px;height:36px;border-radius:9px;object-fit:cover;
  background:#1e1e30;flex-shrink:0;display:block;
}
.channel-dot{
  width:10px;height:10px;border-radius:50%;background:#1e88e5;flex-shrink:0;
  box-shadow:0 0 6px #1e88e5;margin:0 13px;
}
.channel-info{min-width:0;display:flex;flex-direction:column;gap:3px;}
.channel-name{
  color:#e0e0e0;font-size:13px;font-weight:500;line-height:1.3;
  overflow:hidden;text-overflow:ellipsis;display:-webkit-box;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word;
}
.channel-cat{color:#4a6fa5;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;}
.no-results{color:#444;text-align:center;padding:40px 16px;font-size:14px;grid-column:1/-1;}
</style>
</head>
<body>

<iframe id="main-iframe" allowfullscreen allow="encrypted-media; fullscreen; autoplay; picture-in-picture"></iframe>

<div id="picker">
  <div class="picker-header">
    <div class="picker-title">⚡ <span>Live</span> Channels</div>
  </div>
  <div class="search-bar">
    <input type="text" id="search-input" placeholder="Search channels…" autocomplete="off">
  </div>
  <div class="channel-grid" id="channel-grid"></div>
</div>

<script>
window.addEventListener('DOMContentLoaded', function () {
  'use strict';

  var JSON_URLS = [
    'https://sonujson-v5.pages.dev/loura.json',
    'https://sportlink-tv10.pages.dev/id.json'
  ];
  var FETCH_TIMEOUT = 10000;

  var urlParams = new URLSearchParams(window.location.search);
  var id        = urlParams.get('id');
  var iframe    = document.getElementById('main-iframe');
  var picker    = document.getElementById('picker');

  // If no ?id= parameter is present, do not redirect, just show channel picker or handle accordingly.
  // (Removed the automatic redirect to Telegram as requested)

  function normalise(raw) {
    if (Array.isArray(raw)) return raw;
    if (!raw || typeof raw !== 'object') return [];
    if (Array.isArray(raw.iframes))  return raw.iframes;
    if (Array.isArray(raw.channels)) return raw.channels;
    if (Array.isArray(raw.data))     return raw.data;
    return [raw];
  }

  function fetchWithTimeout(url, ms) {
    var ctrl  = ('AbortController' in window) ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, ms);
    var opts  = { cache: 'no-store' };
    if (ctrl) opts.signal = ctrl.signal;

    return fetch(url, opts).then(
      function (res) { clearTimeout(timer); return res; },
      function (err) { clearTimeout(timer); throw err; }
    );
  }

  async function loadChannels() {
    var errors = [];
    var combined = [];

    for (var i = 0; i < JSON_URLS.length; i++) {
      var url = JSON_URLS[i];
      try {
        var res = await fetchWithTimeout(url, FETCH_TIMEOUT);

        if (!res.ok) throw new Error('HTTP ' + res.status + ' ' + res.statusText);

        var txt = await res.text();
        var raw;

        try {
          raw = JSON.parse(txt);
        } catch (parseErr) {
          throw new Error('response was not JSON (got HTML/404 page?)');
        }

        combined = combined.concat(normalise(raw));
      } catch (e) {
        var reason = (e && e.name === 'AbortError')
          ? 'timed out after ' + (FETCH_TIMEOUT / 1000) + 's'
          : (e && e.message ? e.message : String(e));
        errors.push(url + ' -> ' + reason);
      }
    }

    if (!combined.length) {
      throw new Error(errors.join('  |  '));
    }

    return combined;
  }

  function showPickerMode(channels) {
    iframe.style.display = 'none';
    picker.style.display = 'block';
    renderChannels(channels);

    var search = document.getElementById('search-input');
    if (search.dataset.bound === '1') return;
    search.dataset.bound = '1';

    search.addEventListener('input', function (e) {
      var q = e.target.value.trim().toLowerCase();
      renderChannels(channels.filter(function (c) {
        return (c.name || '').toLowerCase().indexOf(q) !== -1 ||
               (c.category || '').toLowerCase().indexOf(q) !== -1;
      }));
    });
  }

  function renderChannels(channels) {
    var grid = document.getElementById('channel-grid');
    grid.innerHTML = '';

    if (!channels.length) {
      var empty = document.createElement('div');
      empty.className = 'no-results';
      empty.textContent = 'No channels found';
      grid.appendChild(empty);
      return;
    }

    var seen = new Set();

    channels.forEach(function (ch) {
      var key = (ch.id !== undefined && ch.id !== null) ? String(ch.id) : (ch.name || '');
      if (!key || seen.has(key)) return;
      seen.add(key);

      var card = document.createElement('a');
      card.className = 'channel-card';
      card.href = '?id=' + encodeURIComponent(ch.id !== undefined && ch.id !== null ? ch.id : '');

      if (ch.logourl) {
        var img = document.createElement('img');
        img.className = 'channel-logo';
        img.src = ch.logourl;
        img.alt = '';
        img.loading = 'lazy';
        img.onerror = function () {
          var dot = document.createElement('div');
          dot.className = 'channel-dot';
          if (img.parentNode) img.parentNode.replaceChild(dot, img);
        };
        card.appendChild(img);
      } else {
        var dot = document.createElement('div');
        dot.className = 'channel-dot';
        card.appendChild(dot);
      }

      var info = document.createElement('div');
      info.className = 'channel-info';

      var nameEl = document.createElement('div');
      nameEl.className = 'channel-name';
      nameEl.textContent = ch.name || 'Unnamed';
      info.appendChild(nameEl);

      if (ch.category) {
        var catEl = document.createElement('div');
        catEl.className = 'channel-cat';
        catEl.textContent = ch.category;
        info.appendChild(catEl);
      }

      card.appendChild(info);
      grid.appendChild(card);
    });
  }

  function showError(msg) {
    iframe.style.display = 'none';
    picker.style.display = 'none';

    var old = document.getElementById('error-screen');
    if (old) old.parentNode.removeChild(old);

    var box = document.createElement('div');
    box.id = 'error-screen';
    box.style.cssText =
      'position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;' +
      'justify-content:center;gap:14px;padding:24px;text-align:center;' +
      'color:#fff;font-family:Segoe UI,sans-serif;';

    var title = document.createElement('div');
    title.style.cssText = 'font-size:18px;font-weight:700;';
    title.textContent = 'Could not load channels';

    var detail = document.createElement('div');
    detail.style.cssText =
      'font-size:12px;color:#8e9baf;max-width:460px;line-height:1.7;' +
      'word-break:break-word;background:#141420;border:1px solid #1e1e30;' +
      'border-radius:12px;padding:14px;';
    detail.textContent = msg;

    var btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = 'Retry';
    btn.style.cssText =
      'background:linear-gradient(135deg,#4fc3f7,#2196f3);color:#fff;border:none;' +
      'border-radius:40px;padding:12px 32px;font-size:14px;font-weight:700;' +
      'cursor:pointer;font-family:inherit;box-shadow:0 6px 24px rgba(79,195,247,.25);';
    btn.addEventListener('click', function () {
      box.parentNode.removeChild(box);
      start();
    });

    box.appendChild(title);
    box.appendChild(detail);
    box.appendChild(btn);
    document.body.appendChild(box);
  }

  function boot(raw) {
    var list = normalise(raw);

    if (!list.length) {
      showError('The JSON loaded but contained no channel entries.');
      return;
    }

    var target = list.find(function (item) {
      return String(item.id) === String(id);
    });

    if (target && target.iframeSrc) {
      picker.style.display  = 'none';
      iframe.style.display  = 'block';
      iframe.src            = target.iframeSrc;

      if (target.hit) {
        try {
          fetch(target.hit, { mode: 'no-cors', keepalive: true }).catch(function () {});
        } catch (e) {}
      }
    } else {
      showPickerMode(list);
    }
  }

  function start() {
    loadChannels()
      .then(boot)
      .catch(function (e) {
        showError(e && e.message ? e.message : 'Unknown error');
      });
  }

  start();
});
</script>

</body>
</html>
